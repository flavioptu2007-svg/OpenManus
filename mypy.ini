# mypy configuration for OpenManus
# Run:  ./.venv/bin/python -m mypy          (uses `files` below)
#       ./.venv/bin/python -m mypy app/     (targeted)
[mypy]
python_version = 3.12
# pydantic v2 plugin: proper typing for model fields, validators and
# construction (avoids spurious arg-type/call-arg errors on pydantic models).
plugins = pydantic.mypy
# Third-party libraries without type stubs (crawl4ai, browsergym, gymnasium,
# playwright, browser-use, docker...) become Any instead of errors.
ignore_missing_imports = true
show_error_codes = true

files = app,
    insert_openrouter_key.py,
    update_openrouter_config.py,
    fix_path_utils.py
