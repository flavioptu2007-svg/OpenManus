# Python hooks run with the project's Python 3.12 (pre-commit's default here
# would otherwise pick Python 3.14, which old black (23.x) cannot parse:
# `module 'ast' has no attribute 'Str'`). Bumped black to a 3.12-compatible
# release.
# NOTE: `python3.12` must be resolvable on PATH for local runs. On this machine
# it is a symlink to the uv-managed Python 3.12.13 (~/.local/bin/python3.12).
# CI provides it via actions/setup-python.
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.0.1
    hooks:
      - id: autoflake
        args:
          [
            --remove-all-unused-imports,
            --ignore-init-module-imports,
            --expand-star-imports,
            --remove-duplicate-keys,
            --remove-unused-variables,
            --recursive,
            --in-place,
            --exclude=__init__.py,
          ]
        files: \.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args:
          ["--profile", "black", "--filter-files", "--lines-after-imports=2"]

  # ─── GitGuardian ggshield — secret scanning ───────────────────────────────
  # Blocks commits (pre-commit) and pushes (pre-push) that contain secrets.
  # Uses the locally installed ggshield binary (see .ggshield-hook.sh).
  # Requires authentication: export GITGUARDIAN_API_KEY=... (or: ggshield auth login)
  # Skips cleanly when the key is absent, so it never blocks development
  # before the user authenticates.
  - repo: local
    hooks:
      - id: ggshield-secret-scan
        name: ggshield - secret scan (staged changes)
        entry: ./.ggshield-hook.sh pre-commit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: ggshield-secret-scan-push
        name: ggshield - secret scan (commits being pushed)
        entry: ./.ggshield-hook.sh pre-push
        language: system
        pass_filenames: false
        stages: [pre-push]
