name: Pre-commit checks

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

jobs:
  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      # Only lint the files changed by this PR/push. Running `--all-files`
      # would have the auto-fix hooks (black 24.10.0, isort, autoflake)
      # reformat the whole repo and fail CI, which conflicts with the decision
      # to keep the repository at its original formatting.
      - name: Run pre-commit hooks on changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="${{ github.event.before }}"
          fi
          # New branches have no previous commit (all-zeros sha) — nothing to diff.
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch (no previous commit) - skipping."
            exit 0
          fi
          git fetch --depth=100 origin "$BASE_REF" >/dev/null 2>&1 || true
          # Fail loudly if the base ref can't be resolved - a silent skip would
          # report green CI while linting nothing.
          if ! git rev-parse --verify --quiet "$BASE_REF" >/dev/null; then
            echo "ERROR: could not resolve base ref $BASE_REF; aborting lint."
            exit 1
          fi
          # Three-dot diff (changes introduced by this branch); fall back to
          # two-dot if the merge-base is unavailable (shallow base fetch).
          # --diff-filter=d excludes deleted files (pre-commit can't lint them).
          FILES="$(git diff --name-only --diff-filter=d "$BASE_REF"...HEAD 2>/dev/null || git diff --name-only --diff-filter=d "$BASE_REF" HEAD)"
          if [ -z "$FILES" ]; then
            echo "No changed files - nothing to check."
            exit 0
          fi
          echo "Changed files ($(echo "$FILES" | wc -l)):"
          echo "$FILES"
          echo "$FILES" | xargs pre-commit run --files
