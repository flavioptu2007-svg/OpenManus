name: CI — Tests & Quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Test Suite ──────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
      # Don't cancel other matrix jobs if one fails
      fail-fast: false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest \
            tests/test_toolcall_agent.py \
            tests/test_python_execute.py \
            tests/test_bash_tool.py \
            tests/test_manus_agent.py \
            tests/test_search_cache.py \
            -v --tb=short \
            --cov=app/tool --cov=app/agent --cov=app/llm --cov=app/utils \
            --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage
          retention-days: 7

  # ─── Lint & Format ───────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

  # ─── Import & Syntax Check ───────────────────────────────────────────────
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          set +e
          errors=0
          while IFS= read -r -d '' f; do
            if ! python -m py_compile "$f" 2>/dev/null; then
              echo "❌ $f"
              errors=$((errors + 1))
            else
              echo "✅ $f"
            fi
          done < <(find app -name '*.py' -print0)
          echo ""
          if [ "$errors" -gt 0 ]; then
            echo "❌ $errors file(s) have syntax errors"
            exit 1
          fi
          echo "✅ All app/ files pass syntax check"
