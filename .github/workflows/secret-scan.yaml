name: Secret Scan (ggshield)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  schedule:
    # Continuous scanning: daily scan of the default branch for leaked secrets
    - cron: '0 6 * * *'

jobs:
  ggshield:
    name: ggshield secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for continuous repo scan

      - name: Run ggshield secret scan
        if: ${{ secrets.GITGUARDIAN_API_KEY != '' }}
        uses: GitGuardian/ggshield-action@main
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        with:
          args: secret scan repo . --json

      - name: Warn - GITGUARDIAN_API_KEY not configured
        if: ${{ secrets.GITGUARDIAN_API_KEY == '' }}
        run: echo "::warning::GITGUARDIAN_API_KEY secret is not set. Add it in Settings -> Secrets and variables -> Actions to enable the secret scan."
