version: "3.9"

services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      FLASK_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///data/app.db
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
      - api_data:/app/data

  worker:
    build: .
    command: celery -A run.celery worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      FLASK_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///data/app.db
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
      - api_data:/app/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  uploads:
  redis_data:
  api_data:
