[pytest]
# Async test mode: "auto" lets async def tests run without explicit markers
asyncio_mode = auto

# Suppress known warnings in tests
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:pydantic_core.*
    ignore::UserWarning:pydantic.*
    ignore::UserWarning:pydantic_core.*

# Test discovery paths
testpaths = tests
# Verbose output by default
addopts = -v --tb=short
